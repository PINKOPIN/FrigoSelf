name: frigoself
description: FrigoSelf - Meno sprechi, più libertà. Gestisci frigo, congelatore e dispensa di famiglia.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Stato
  flutter_riverpod: ^2.5.1

  # Backend: Supabase (il tuo progetto, vedi supabase/SETUP_SUPABASE.md)
  supabase_flutter: ^2.8.0
  crypto: ^3.0.3

  # Accesso social
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # Notifiche locali (funzionano anche offline)
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  flutter_timezone: ^2.1.0

  # Foto, barcode, OCR
  image_picker: ^1.1.2
  mobile_scanner: ^5.2.3
  google_mlkit_text_recognition: ^0.13.1
  cached_network_image: ^3.4.1
  http: ^1.2.2

  # UI
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  qr_flutter: ^4.1.0

  # Utilità
  intl: ^0.20.3
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  csv: ^6.0.0
  pdf: ^3.11.1
  printing: ^5.13.3
  logger: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon_fg.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: false
  assets:
    - assets/images/
